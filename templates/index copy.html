<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu des températures – Raspberry Pi</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            align-items: flex-start;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
        }
        input[type="number"] {
            width: 100%;
        }
        textarea {
            width: 100%;
        }
        button {
            padding: 0.5rem 1rem;
            margin-top: 0.5rem;
            cursor: pointer;
        }
        #gameStatus {
            margin-top: 0.5rem;
            font-weight: bold;
            white-space: pre-wrap;
        }
        pre {
            background: #f7f7f7;
            padding: 0.5rem;
            border-radius: 5px;
            overflow-x: auto;
        }

        /* --------- Blocs de réponses sous le graphique --------- */
        .rpi-blocks-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .rpi-block {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 0.75rem;
            background: #fafafa;
        }
        .rpi-block h3 {
            margin-top: 0;
            margin-bottom: 0.25rem;
        }
        .rpi-max-temp {
            font-size: 0.9rem;
            font-style: italic;
            margin-top: 0.1rem;
            margin-bottom: 0.5rem;
        }
        .rpi-block h4 {
            margin: 0.25rem 0;
        }
    </style>
</head>

<body>
    <h1>Jeu : prédire les températures des Raspberry Pi</h1>

    <div class="grid">

        <!-- ======================= GRAPHIQUE ======================= -->
        <div class="card">
            <h2>Températures en temps réel</h2>
            <p>Actualisation toutes les 2 secondes.</p>
            <canvas id="tempChart" width="800" height="400"></canvas>

            <!-- Blocs de réponses + températures max sous le graphique -->
            <div id="rpiBlocksContainer" class="rpi-blocks-container"></div>
        </div>

        <!-- ======================= FORMULAIRE DU JEU ======================= -->
        <div class="card">
            <h2>Votre prédiction</h2>
            <form id="gameForm">

                <div>
                    {% for name in raspberries %}
                        <label>
                            Température maximale prévue pour {{ name }} (°C) :
                            <input type="number" step="0.1" id="pred-{{ name }}" required>
                        </label>
                    {% endfor %}
                </div>

                <label>
                    Prompt pour Ollama :
                    <textarea id="prompt" rows="4" placeholder="Choisis bien ton prompt..."></textarea>
                </label>

                <button type="submit">Lancer le jeu</button>

                <div id="gameStatus"></div>

                <!-- Ancien conteneur global (on le garde mais il n’est plus utilisé directement) -->
                <div id="ollamaResponses" style="margin-top: 1rem;"></div>
            </form>
        </div>

    </div>

    <!-- ======================= JAVASCRIPT ======================= -->
    <script>
        // ----------------------- GRAPH -----------------------
        const ctx = document.getElementById('tempChart').getContext('2d');
        const labels = [];

        const raspberries = {{ raspberries|tojson }};

        const COLORS = [
            '#e74c3c', // rouge
            '#3498db', // bleu
            '#2ecc71', // vert
            '#9b59b6', // violet
            '#f1c40f', // jaune
            '#e67e22', // orange
        ];

        const datasets = raspberries.map((name, idx) => ({
            label: name,
            data: [],
            borderColor: COLORS[idx % COLORS.length],
            backgroundColor: COLORS[idx % COLORS.length] + '33',
            tension: 0.2,
            pointRadius: 2,
            borderWidth: 2,
        }));

        const config = {
            type: 'line',
            data: { labels: labels, datasets: datasets },
            options: {
                responsive: true,
                scales: {
                    y: { title: { display: true, text: 'Température (°C)' } },
                    x: { title: { display: true, text: 'Temps' } }
                }
            }
        };

        const tempChart = new Chart(ctx, config);

        // ---------- Blocs de réponses / max temp sous le graphe ----------
        const rpiBlocksContainer = document.getElementById('rpiBlocksContainer');
        const rpiBlocks = {};     // name -> DOM block

        raspberries.forEach((name) => {
            const block = document.createElement('div');
            block.className = 'rpi-block';
            block.innerHTML = `
                <h3>${name}</h3>
                <p class="rpi-max-temp">Température max pendant l'inférence : -- °C</p>
                <h4>Réponse d’Ollama</h4>
                <pre class="rpi-response">(en attente...)</pre>
            `;
            rpiBlocksContainer.appendChild(block);
            rpiBlocks[name] = block;
        });

        function resetMaxTempDisplay() {
            raspberries.forEach((name) => {
                const block = rpiBlocks[name];
                if (!block) return;
                const p = block.querySelector('.rpi-max-temp');
                p.textContent = "Température max pendant l'inférence : -- °C";
            });
        }

        function updateMaxTempsFromBackend(actualTemps) {
            if (!actualTemps) return;
            for (const name of raspberries) {
                const block = rpiBlocks[name];
                if (!block) continue;
                const p = block.querySelector('.rpi-max-temp');
                const value = actualTemps[name];
                if (value == null) {
                    p.textContent = "Température max pendant l'inférence : N/A";
                } else {
                    p.textContent = `Température max pendant l'inférence : ${value.toFixed(1)} °C`;
                }
            }
        }

        async function fetchTemperatures() {
            try {
                const response = await fetch('/api/temperatures');
                const json = await response.json();

                labels.push(json.timestamp);
                if (labels.length > 50) labels.shift();

                config.data.datasets.forEach((dataset) => {
                    const name = dataset.label;
                    const temp = json.temperatures[name];
                    dataset.data.push(temp);
                    if (dataset.data.length > 50) dataset.data.shift();
                });

                tempChart.update();
            } catch (err) {
                console.error('Erreur en récupérant les températures:', err);
            }
        }

        fetchTemperatures();
        setInterval(fetchTemperatures, 2000);

        // ----------------------- JEU -----------------------
        const gameForm = document.getElementById('gameForm');
        const gameStatusDiv = document.getElementById('gameStatus');
        const ollamaResponsesDiv = document.getElementById('ollamaResponses');
        let gameInterval = null;

        function renderOllamaResponses(responses) {
            // Affichage dans les blocs sous le graphe
            if (!responses) {
                raspberries.forEach((name) => {
                    const block = rpiBlocks[name];
                    if (!block) return;
                    const pre = block.querySelector('.rpi-response');
                    pre.textContent = '(en attente...)';
                });
                ollamaResponsesDiv.textContent = '';
                return;
            }

            raspberries.forEach((name) => {
                const text = responses[name] ?? '(aucune réponse)';
                const block = rpiBlocks[name];
                if (!block) return;
                const pre = block.querySelector('.rpi-response');
                pre.textContent = text;
            });

            // Pour compatibilité, petit résumé texte dans l’ancien div
            let html = '<h3>Réponses d’Ollama</h3><ul>';
            for (const [name, text] of Object.entries(responses)) {
                html += `
                    <li>
                        <strong>${name}</strong><br>
                        <pre>${text}</pre>
                    </li>`;
            }
            html += '</ul>';
            ollamaResponsesDiv.innerHTML = html;
        }

        gameForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const prompt = document.getElementById('prompt').value;
            const predictions = {};

            raspberries.forEach((name) => {
                const value = document.getElementById(`pred-${name}`).value;
                predictions[name] = value;
            });

            try {
                const res = await fetch('/api/start_game', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, predictions })
                });
                const json = await res.json();

                if (json.status === 'started') {
                    renderOllamaResponses(json.ollama_responses);
                    resetMaxTempDisplay();

                    // info optionnelle fournie par le backend : durée de la fenêtre
                    if (json.measurement_window_seconds != null) {
                        gameStatusDiv.textContent =
                            `Mesure de la température pendant l'inférence en cours...\n` +
                            `Résultat dans environ ${json.measurement_window_seconds} s.`;
                    } else {
                        gameStatusDiv.textContent =
                            `Mesure de la température pendant l'inférence en cours...`;
                    }

                    // On commence tout de suite à sonder /api/game_status,
                    // c'est lui qui gère la fenêtre [prompt ; dernière réponse + 10s]
                    startPollingGameStatus();
                } else {
                    gameStatusDiv.textContent = 'Impossible de lancer la partie.';
                }
            } catch (err) {
                console.error('Erreur start_game:', err);
                gameStatusDiv.textContent = 'Erreur lors du lancement de la partie.';
            }
        });

        async function checkGameStatus() {
            try {
                const res = await fetch('/api/game_status');
                const json = await res.json();

                if (json.status === 'no_game') return;

                if (json.status === 'waiting') {
                    if (json.remaining_seconds != null) {
                        gameStatusDiv.textContent =
                            `Mesure de la température pendant l'inférence...\n` +
                            `Encore ${json.remaining_seconds} s environ.`;
                    } else {
                        gameStatusDiv.textContent =
                            `Mesure de la température pendant l'inférence...`;
                    }

                    renderOllamaResponses(json.ollama_responses);
                }

                if (json.status === 'finished') {
                    clearInterval(gameInterval);
                    gameInterval = null;

                    let msg = `Partie terminée ! Score : ${json.score.toFixed(1)} points.\n\n`;
                    msg += 'Erreurs par Raspberry Pi (en °C) :\n';

                    for (const [name, err] of Object.entries(json.errors)) {
                        msg += `- ${name} : ${err === null ? 'N/A' : err.toFixed(2)}\n`;
                    }

                    gameStatusDiv.textContent = msg;

                    renderOllamaResponses(json.ollama_responses);
                    updateMaxTempsFromBackend(json.actual_temperatures);
                }

            } catch (err) {
                console.error('Erreur game_status:', err);
            }
        }

        function startPollingGameStatus() {
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(checkGameStatus, 3000);
        }
    </script>
</body>
</html>
