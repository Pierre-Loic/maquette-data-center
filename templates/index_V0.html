<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu des températures – Raspberry Pi</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            align-items: flex-start;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
        }
        input[type="number"] {
            width: 100%;
        }
        textarea {
            width: 100%;
        }
        button {
            padding: 0.5rem 1rem;
            margin-top: 0.5rem;
            cursor: pointer;
        }
        #gameStatus {
            margin-top: 0.5rem;
            font-weight: bold;
            white-space: pre-wrap;
        }
        pre {
            background: #f7f7f7;
            padding: 0.5rem;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <h1>Jeu : prédire les températures des Raspberry Pi</h1>

    <div class="grid">

        <!-- ======================= GRAPHIQUE ======================= -->
        <div class="card">
            <h2>Températures en temps réel</h2>
            <p>Actualisation toutes les secondes.</p>
            <canvas id="tempChart" width="800" height="400"></canvas>
        </div>

        <!-- ======================= FORMULAIRE DU JEU ======================= -->
        <div class="card">
            <h2>Votre prédiction</h2>
            <form id="gameForm">
                <div>
                    {% for name in raspberries %}
                        <label>
                            Température prévue pour {{ name }} (°C) :
                            <input type="number" step="0.1" id="pred-{{ name }}" required>
                        </label>
                    {% endfor %}
                </div>

                <label>
                    Prompt pour Ollama :
                    <textarea id="prompt" rows="4" placeholder="Décris la charge que tu veux appliquer..."></textarea>
                </label>

                <button type="submit">Lancer le jeu</button>

                <div id="gameStatus"></div>
                <div id="ollamaResponses" style="margin-top: 1rem;"></div>
            </form>
        </div>

    </div>

    <!-- ======================= JAVASCRIPT ======================= -->
    <script>
        // ----------------------- GRAPH -----------------------
        const ctx = document.getElementById('tempChart').getContext('2d');
        const labels = [];

        const raspberries = {{ raspberries|tojson }};

        const datasets = raspberries.map((name) => ({
            label: name,
            data: [],
        }));

        const config = {
            type: 'line',
            data: { labels: labels, datasets: datasets },
            options: {
                responsive: true,
                scales: {
                    y: { title: { display: true, text: 'Température (°C)' } },
                    x: { title: { display: true, text: 'Temps' } }
                }
            }
        };

        const tempChart = new Chart(ctx, config);

        async function fetchTemperatures() {
            try {
                const response = await fetch('/api/temperatures');
                const json = await response.json();

                labels.push(json.timestamp);
                if (labels.length > 50) labels.shift();

                config.data.datasets.forEach((dataset) => {
                    const name = dataset.label;
                    dataset.data.push(json.temperatures[name]);
                    if (dataset.data.length > 50) dataset.data.shift();
                });

                tempChart.update();
            } catch (err) {
                console.error('Erreur en récupérant les températures:', err);
            }
        }

        fetchTemperatures();
        setInterval(fetchTemperatures, 2000);

        // ----------------------- JEU -----------------------
        const gameForm = document.getElementById('gameForm');
        const gameStatusDiv = document.getElementById('gameStatus');
        const ollamaResponsesDiv = document.getElementById('ollamaResponses');
        let gameInterval = null;

        function renderOllamaResponses(responses) {
            if (!responses) {
                ollamaResponsesDiv.textContent = '';
                return;
            }

            let html = '<h3>Réponses d’Ollama</h3><ul>';

            for (const [name, text] of Object.entries(responses)) {
                html += `
                    <li>
                        <strong>${name}</strong><br>
                        <pre>${text}</pre>
                    </li>`;
            }

            html += '</ul>';
            ollamaResponsesDiv.innerHTML = html;
        }

        gameForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const prompt = document.getElementById('prompt').value;
            const predictions = {};

            raspberries.forEach((name) => {
                const value = document.getElementById(`pred-${name}`).value;
                predictions[name] = value;
            });

            try {
                const res = await fetch('/api/start_game', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, predictions })
                });
                const json = await res.json();

                if (json.status === 'started') {
                    gameStatusDiv.textContent =
                        `Partie lancée ! Résultat dans environ ${json.check_after_seconds} s...`;

                    renderOllamaResponses(json.ollama_responses);

                    startPollingGameStatus();
                } else {
                    gameStatusDiv.textContent = 'Impossible de lancer la partie.';
                }
            } catch (err) {
                console.error('Erreur start_game:', err);
                gameStatusDiv.textContent = 'Erreur lors du lancement de la partie.';
            }
        });

        async function checkGameStatus() {
            try {
                const res = await fetch('/api/game_status');
                const json = await res.json();

                if (json.status === 'no_game') return;

                if (json.status === 'waiting') {
                    gameStatusDiv.textContent =
                        `Partie en cours... encore ${json.remaining_seconds} s.`;

                    renderOllamaResponses(json.ollama_responses);
                }

                if (json.status === 'finished') {
                    clearInterval(gameInterval);

                    let msg = `Partie terminée ! Score : ${json.score.toFixed(1)} points.\n\n`;
                    msg += 'Erreurs par Raspberry Pi (en °C) :\n';

                    for (const [name, err] of Object.entries(json.errors)) {
                        msg += `- ${name} : ${err === null ? 'N/A' : err.toFixed(2)}\n`;
                    }

                    gameStatusDiv.textContent = msg;

                    renderOllamaResponses(json.ollama_responses);
                }

            } catch (err) {
                console.error('Erreur game_status:', err);
            }
        }

        function startPollingGameStatus() {
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(checkGameStatus, 3000);
        }
    </script>
</body>
</html>
